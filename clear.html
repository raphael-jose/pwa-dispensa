<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Atualizando...</title>
  <meta http-equiv="refresh" content="3;url=./">
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px; background: #f0fdf4;">
  <h2>🔄 Atualizando aplicativo...</h2>
  <p>Limpando cache antigo...</p>
  <div id="status"></div>
  <script>
    const status = document.getElementById('status');
    
    async function clearAndReload() {
      try {
        // Unregister all service workers
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          await reg.unregister();
          status.innerHTML += '<p>✅ Service worker removido</p>';
        }
        
        // Clear all caches
        const keys = await caches.keys();
        for (const key of keys) {
          await caches.delete(key);
          status.innerHTML += '<p>✅ Cache limpo: ' + key + '</p>';
        }
        
        status.innerHTML += '<p style="color:green;font-weight:bold">Pronto! Redirecionando...</p>';
        
        // Reload after 1 second
        setTimeout(() => { window.location.href = './'; }, 1000);
      } catch (err) {
        status.innerHTML += '<p style="color:red">Erro: ' + err.message + '</p>';
        // Try to redirect anyway
        setTimeout(() => { window.location.href = './'; }, 2000);
      }
    }
    
    clearAndReload();
  </script>
</body>
</html>
